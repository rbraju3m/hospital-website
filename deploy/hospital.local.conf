# RBR Hospital — local Apache vhost, over HTTPS.
#
# The portal takes a patient's phone number and password, and the panel takes a
# staff login, so development happens over TLS too — a login form that works on
# plain http in dev is one that ships that way.
#
# This file uses a self-signed certificate and therefore does NOT send HSTS.
# That is deliberate, and the one thing to understand before copying this file
# to a real server: HSTS tells the browser to refuse plain http for this host
# for the next year, and it also removes the "proceed anyway" button that a
# self-signed certificate depends on. Set it here and hospital.local becomes
# unreachable in that browser until the HSTS entry is cleared by hand.
# Production is deploy/hospital-production.conf, and it does send it.
#
# DocumentRoot MUST point at public/ — serving the project root exposes .env,
# storage/ and vendor/ as a directory listing.
#
# Install:
#   sudo a2enmod ssl rewrite headers
#   cp deploy/hospital.local.conf /etc/apache2/sites-available/    # no sudo on this box: sites-available is world-writable
#   sudo a2ensite hospital.local && sudo systemctl reload apache2
#   echo "127.0.0.1 hospital.local" | sudo tee -a /etc/hosts
#
# Make the certificate this file expects (ten years, so it is not a chore):
#   sudo mkdir -p /etc/ssl/hospital.local
#   sudo openssl req -x509 -nodes -newkey rsa:2048 -days 3650 \
#     -keyout /etc/ssl/hospital.local/privkey.pem \
#     -out    /etc/ssl/hospital.local/fullchain.pem \
#     -subj "/CN=hospital.local" \
#     -addext "subjectAltName=DNS:hospital.local,DNS:www.hospital.local"
#   sudo chmod 600 /etc/ssl/hospital.local/privkey.pem
#
# The browser will warn once and let you continue; to stop it warning, import
# fullchain.pem into the browser's or the system's trust store.
#
# Then set APP_URL=https://hospital.local in .env. That is not cosmetic — it is
# what makes the signed confirmation links in emails validate, and what marks
# the session cookie Secure. See app/Support/Https.php.
#
# Apache runs as www-data and Laravel writes logs, compiled views and uploads,
# so storage/ and bootstrap/cache carry group www-data with setgid — the group
# is inherited by anything written later, which a bare chmod would not survive:
#   chgrp -R www-data storage bootstrap/cache
#   chmod -R g+rwX storage bootstrap/cache
#   find storage bootstrap/cache -type d -exec chmod g+s {} \;
#
# Apache runs mod_php 8.4 on this box; the CLI/Composer side uses php8.3.
# Laravel 13 requires ^8.3, so both are within range.

<VirtualHost *:80>
    ServerName hospital.local
    ServerAlias www.hospital.local

    # Nothing is served over plain http, not even in development. The
    # application generates https URLs (APP_URL), and a mixture of the two is
    # how a session cookie ends up crossing the wire in the clear.
    RedirectPermanent / https://hospital.local/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin rashedul@rightbrainsolution.com
    ServerName hospital.local
    ServerAlias www.hospital.local

    DocumentRoot /var/www/html/hospital-website/public

    SSLEngine on
    SSLCertificateFile    /etc/ssl/hospital.local/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/hospital.local/privkey.pem

    # TLS 1.2 and 1.3 only. Everything below it is broken, and there is no
    # ancient client to keep happy on a site that has not launched.
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off

    # No Strict-Transport-Security here. See the note at the top of this file:
    # with a self-signed certificate it locks this hostname out of the browser.

    <Directory /var/www/html/hospital-website/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Never serve the application internals, even if DocumentRoot is misconfigured.
    <DirectoryMatch "/var/www/html/hospital-website/(app|bootstrap|config|database|deploy|resources|routes|storage|tests|vendor)/">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/hospital.local-error.log
    CustomLog ${APACHE_LOG_DIR}/hospital.local-access.log combined
</VirtualHost>
</IfModule>
