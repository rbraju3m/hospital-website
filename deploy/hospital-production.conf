# RBR Hospital — production Apache vhost.
#
# The same shape as deploy/hospital.local.conf with three differences: a real
# certificate, HSTS, and an ACME exception on port 80 so the certificate can
# renew itself. Change rbrhospital.example to the real hostname everywhere in
# this file — it appears six times, and a redirect pointing at the wrong host
# is a site that redirects visitors off itself.
#
# Install:
#   sudo a2enmod ssl rewrite headers
#   sudo cp deploy/hospital-production.conf /etc/apache2/sites-available/hospital.conf
#   sudo a2ensite hospital && sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Certificate, via Let's Encrypt. Install the http vhost first and leave it
# reachable on port 80 — that is how the challenge is answered:
#   sudo apt install certbot
#   sudo certbot certonly --webroot -w /var/www/html/hospital-website/public \
#       -d rbrhospital.example -d www.rbrhospital.example
#   systemctl list-timers | grep certbot        # renewal is a timer, check it exists
#   sudo certbot renew --dry-run                # and that it actually works
#
# Then, in .env:
#   APP_URL=https://rbrhospital.example
#   APP_ENV=production
#   APP_DEBUG=false
#   php8.3 artisan config:clear
#
# APP_URL is the load-bearing one. It sets the scheme of every link the
# application generates — including the signed confirmation link that
# `appointments:remind` builds under cron, where there is no request to take a
# scheme from — and it is what marks the session cookie Secure. Leave it on
# http and the confirmation link in every appointment email answers 403 to the
# patient who taps it, for reasons nothing in the logs will mention.
# See app/Support/Https.php.
#
# ---------------------------------------------------------------------------
# About HSTS, before you enable the long one below
#
# Strict-Transport-Security tells every browser that has seen this site to
# refuse plain http for this hostname for max-age seconds, and it cannot be
# taken back — an expired or misissued certificate then makes the site
# unreachable rather than warned about, for the remainder of that window.
#
# So it ships here at 300 seconds. Once the certificate is installed, renewal
# has been proven with `certbot renew --dry-run`, and the site has run a few
# days without a mixed-content or certificate complaint, raise it:
#
#   Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
#
# `includeSubDomains` commits every subdomain of this hostname to https as
# well — including any that do not exist yet. That is the intent for a hospital
# whose only subdomain is www, but it is a commitment, not a default.
# Preloading is a further step again and is not proposed here: it is a browser-
# shipped list, and getting off it takes months.
# ---------------------------------------------------------------------------

<VirtualHost *:80>
    ServerName rbrhospital.example
    ServerAlias www.rbrhospital.example

    DocumentRoot /var/www/html/hospital-website/public

    # Certbot answers its challenge over plain http, so this one path stays
    # reachable. Without it, renewal fails silently and the certificate expires
    # ninety days later — with HSTS in force, which is the bad combination.
    <Directory /var/www/html/hospital-website/public/.well-known/acme-challenge>
        Require all granted
        Options -Indexes
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin rashedul@rightbrainsolution.com
    ServerName rbrhospital.example
    ServerAlias www.rbrhospital.example

    DocumentRoot /var/www/html/hospital-website/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/rbrhospital.example/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/rbrhospital.example/privkey.pem

    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off

    # Start short. Read the note at the top of this file before raising it.
    Header always set Strict-Transport-Security "max-age=300"

    <Directory /var/www/html/hospital-website/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    <DirectoryMatch "/var/www/html/hospital-website/(app|bootstrap|config|database|deploy|resources|routes|storage|tests|vendor)/">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/hospital-error.log
    CustomLog ${APACHE_LOG_DIR}/hospital-access.log combined
</VirtualHost>
</IfModule>
